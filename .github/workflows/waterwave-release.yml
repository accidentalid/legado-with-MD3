name: Build Waterwave Release APK

on:
  workflow_dispatch:
    inputs:
      product:
        description: '产品变体：appCore 基础版无本地引擎，appComic 漫画增强版内置本地 OCR/擦除/气泡检测'
        required: true
        type: choice
        options:
          - appCore
          - appComic
        default: appCore

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PRODUCT: ${{ github.event.inputs.product }}
      PRODUCT_TAG: "${{ github.event.inputs.product == 'appComic' && 'comic' || 'core' }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare pinned UI forks
        uses: ./.github/actions/prepare-ui-forks

      - name: Clear 18PlusList.txt
        run: |
          echo "清空18PlusList.txt"
          echo "" > $GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      # versionCode = 10000 + commit 数：分支包含全部上游提交 + 本仓库提交，
      # 数值天然 ≥ 上游同期版本，覆盖安装不会被 versionCode 卡住。
      - name: Resolve version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          get_prop() { grep -E "^$1=" app/version.properties | head -1 | cut -d= -f2; }
          VERSION_NAME="$(get_prop VERSION_MAJOR).$(get_prop VERSION_MINOR).$(get_prop VERSION_PATCH)"
          echo "COMMIT_COUNT=$COMMIT_COUNT" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "commit count: $COMMIT_COUNT, version: $VERSION_NAME"

      # 签名接线照抄 auto-release.yml：keystore 以 base64 存在 SIGNING_KEY secret，
      # 四个 RELEASE_* gradle 属性追加进根 gradle.properties（app/build.gradle.kts 自动拾取）。
      - name: Release Apk Sign
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "$GITHUB_WORKSPACE/app/waterwave-release-key.jks"
          {
            echo ""
            echo "RELEASE_STORE_FILE=waterwave-release-key.jks"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> "$GITHUB_WORKSPACE/gradle.properties"

      - name: Build Release APK
        run: |
          chmod +x gradlew
          # appCore -> AppCore：Gradle 变体任务名是驼峰形式
          PRODUCT_CAP=$(echo "$PRODUCT" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          ./gradlew assemble${PRODUCT_CAP}Release -PenableAbiSplits=false --no-daemon --no-configuration-cache
        env:
          COMMIT_NUMBER: ${{ env.COMMIT_COUNT }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}

      - name: Check Build Output
        run: |
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/${{ env.PRODUCT }}/release"
          echo "检查 APK 输出目录: $APK_PATH"
          ls -la "$APK_PATH" || true
          APK_COUNT=$(find "$APK_PATH" -maxdepth 1 -name "*.apk" | wc -l | tr -d ' ')
          if [ "$APK_COUNT" -ne 1 ]; then
            echo "预期生成 1 个 universal APK，实际生成 $APK_COUNT 个！"
            exit 1
          fi

      - name: Rename APK Files
        run: |
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/${{ env.PRODUCT }}/release"
          cd "$APK_PATH"
          mv -- *.apk "legado-${VERSION_NAME}-waterwave-${PRODUCT_TAG}-universal.apk"
          ls -la

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legado-waterwave-${{ env.PRODUCT_TAG }}-${{ github.run_number }}
          path: app/build/outputs/apk/${{ env.PRODUCT }}/release/*.apk

      # 供 sync 工作流判断该版本是否已自动出过包；用 API 建 ref（不依赖 git 凭据，
      # 失败原因可见）。同版本重跑时 ref 已存在，忽略即可。
      - name: Mark version as built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f "ref=refs/tags/waterwave-built/${VERSION_NAME}" \
            -f "sha=$(git rev-parse HEAD)" 2>&1 | grep -v "Reference already exists" || true
