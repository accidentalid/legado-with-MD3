name: Sync Upstream HapeLee

on:
  workflow_dispatch:
  schedule:
    # 每天 04:30（北京时间）同步上游
    - cron: '30 20 * * *'

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    # 只在自己的 fork 上跑，避免误在其他环境触发
    if: github.repository == 'accidentalid/legado-with-MD3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN 推送需要显式持有凭据
          persist-credentials: true

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "accidentalid"
          git config user.email "390814415@qq.com"
          git remote add upstream https://github.com/HapeLee/legado-with-MD3.git
          git fetch upstream main
          # merge（不 rebase 不 force push）：本地功能提交靠 merge 保留；
          # 冲突时本步骤失败，交给下一步建 issue 提醒手动处理。
          git merge upstream/main --no-edit

      - name: Push
        if: success()
        run: git push origin main

      # 上游发新 release 且已同步进 main 时自动触发出包；
      # 用 waterwave-built/<版本> tag 防重复（出包工作流成功后打标）。
      - name: Auto build on synced upstream release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          LATEST_TAG=$(gh api repos/HapeLee/legado-with-MD3/releases/latest --jq .tag_name)
          OBJ_TYPE=$(gh api "repos/HapeLee/legado-with-MD3/git/ref/tags/$LATEST_TAG" --jq .object.type)
          SHA=$(gh api "repos/HapeLee/legado-with-MD3/git/ref/tags/$LATEST_TAG" --jq .object.sha)
          # annotated tag 对象需再解一层才到 commit
          if [ "$OBJ_TYPE" = "tag" ]; then
            SHA=$(gh api "repos/HapeLee/legado-with-MD3/git/tags/$SHA" --jq .object.sha)
          fi
          if ! git merge-base --is-ancestor "$SHA" HEAD; then
            echo "上游 release $LATEST_TAG 还没同步进 main，跳过自动出包"
            exit 0
          fi
          get_prop() { grep -E "^$1=" app/version.properties | head -1 | cut -d= -f2; }
          VERSION="$(get_prop VERSION_MAJOR).$(get_prop VERSION_MINOR).$(get_prop VERSION_PATCH)"
          if git ls-remote --exit-code origin "refs/tags/waterwave-built/$VERSION" >/dev/null 2>&1; then
            echo "$VERSION 已出过包（waterwave-built/$VERSION 已存在），跳过"
            exit 0
          fi
          echo "检测到已同步的上游 release $LATEST_TAG（版本 $VERSION），触发自动出包"
          gh workflow run "Build Waterwave Release APK" -R "${{ github.repository }}" --ref main -f product=appCore

      - name: Report merge failure via issue
        if: failure()
        run: |
          gh issue create \
            -R "${{ github.repository }}" \
            --title "上游同步失败：需要手动处理合并冲突" \
            --body "每日同步工作流在合并 HapeLee/legado-with-MD3 main 时失败（很可能是合并冲突）。

          请手动处理：
          \`\`\`bash
          git fetch upstream main
          git merge upstream/main
          # 解决冲突后
          git push origin main
          \`\`\`

          运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
